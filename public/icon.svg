<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Wand & Element Gradient -->
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Sparkle Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="150" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>

  <!-- Magic Wand & Prompt Magic Symbol -->
  <g filter="url(#shadow)">
    <!-- Magic Wand Shaft -->
    <path d="M 148 364 L 270 242 C 275 237, 283 237, 288 242 L 294 248 C 299 253, 299 261, 294 266 L 172 388 C 165 395, 153 393, 148 384 L 148 384 C 143 376, 143 369, 148 364 Z" 
          fill="url(#wandGrad)"/>

    <!-- Wand Tip Core -->
    <circle cx="282" cy="254" r="10" fill="#ffffff" filter="url(#glow)"/>

    <!-- Prompt Chevron Bracket ">" behind magic spark -->
    <path d="M 175 160 L 225 200 L 175 240" 
          fill="none" stroke="#a5b4fc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Prompt Prompt Cursor "_" -->
    <path d="M 245 240 L 295 240" 
          fill="none" stroke="#a5b4fc" stroke-width="20" stroke-linecap="round" opacity="0.8"/>

    <!-- Main Large Magic Star -->
    <path d="M 330 130 
             C 330 162, 342 174, 374 174 
             C 342 174, 330 186, 330 218 
             C 330 186, 318 174, 286 174 
             C 318 174, 330 162, 330 130 Z" 
          fill="url(#starGrad)" filter="url(#glow)"/>

    <!-- Medium Sparkle Top-Left -->
    <path d="M 230 110 
             C 230 126, 236 132, 252 132 
             C 236 132, 230 138, 230 154 
             C 230 138, 224 132, 208 132 
             C 224 132, 230 126, 230 110 Z" 
          fill="#fef08a" filter="url(#glow)"/>

    <!-- Sparkle Bottom-Right -->
    <path d="M 365 265 
             C 365 278, 370 283, 383 283 
             C 370 283, 365 288, 365 301 
             C 365 288, 360 283, 347 283 
             C 360 283, 365 278, 365 265 Z" 
          fill="url(#starGrad)" opacity="0.95"/>

    <!-- Small Sparkle Lower-Left -->
    <circle cx="210" cy="310" r="7" fill="#fde047" opacity="0.9"/>
    <circle cx="370" cy="340" r="5" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Bottom Brand Sub-bar -->
  <rect x="180" y="440" width="152" height="8" rx="4" fill="#a5b4fc" opacity="0.35"/>
</svg>
