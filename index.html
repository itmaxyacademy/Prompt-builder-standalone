<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Builder - AI Studio</title>
    <meta name="description" content="Transform naive prompts into structured engineering frameworks - Maxy Academy" />
    
    <!-- PWA Web App Manifest & Mobile Theme -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PromptBuilder" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />

    <!-- Early PWA Prompt Listener -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
        console.log('[PWA] beforeinstallprompt captured globally');
      });
    </script>
  </head>
  <body class="bg-gray-50 antialiased text-gray-900">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <!-- PWA Service Worker Registration with Auto-Update Detection -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./service-worker.js')
            .then(function(reg) {
              console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
              window.pwaRegistration = reg;

              // Check if a worker is already waiting
              if (reg.waiting) {
                console.log('[PWA] Update already waiting on load, triggering SKIP_WAITING');
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { registration: reg } }));
              }

              // Listen for incoming update
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version installed, triggering SKIP_WAITING');
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { registration: reg } }));
                    }
                  });
                }
              });

              // Check for updates when device goes online
              window.addEventListener('online', function() {
                console.log('[PWA] Device went online, checking SW updates...');
                reg.update().catch(function(err) {
                  console.debug('[PWA] Update check failed:', err);
                });
              });

              // Check when returning to active tab and online
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && navigator.onLine) {
                  reg.update().catch(function(err) {
                    console.debug('[PWA] Visibility update check failed:', err);
                  });
                }
              });
            })
            .catch(function(err) {
              console.error('[PWA] ServiceWorker registration failed:', err);
            });

          // Handle seamless controller change
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              console.log('[PWA] New controller active, reloading page...');
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
